name: Daily selected site sync
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *' # 12:20 JST (GitHub Actions cron is UTC)
permissions:
  contents: write
concurrency:
  group: daily-selected-site-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh approved site records
        run: npm run sync
      - name: Commit only when data changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync selected movie sites'
            git push
          fi
